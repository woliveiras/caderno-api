name: caderno-api

services:
  api:
    build: .
    ports:
      - "${CADERNO_BIND:-127.0.0.1}:${CADERNO_PORT:-8000}:8000"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: caderno
      PGUSER: caderno_app
      PGPASSWORD: ${CADERNO_DB_PASSWORD:-caderno-fixture-only}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: caderno
      POSTGRES_USER: caderno_app
      POSTGRES_PASSWORD: ${CADERNO_DB_PASSWORD:-caderno-fixture-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "caderno_app", "-d", "caderno"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
